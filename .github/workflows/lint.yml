name: lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check deepface tools

      - name: mypy
        run: mypy deepface tools
